<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>자막 뷰어</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- View 1: Home Screen -->
    <div id="view-movies" class="view active">
        <div id="home-screen">
            <div class="home-hero">
                <h1 class="home-title">자막 뷰어</h1>
                <p class="home-subtitle">영상 자막을 크게 읽고, 두 언어를 비교하세요</p>
            </div>
            <div class="home-menu">
                <div class="menu-card" id="menu-movie-list">
                    <span class="menu-icon">📂</span>
                    <div class="menu-text">
                        <div class="menu-title">영화 목록</div>
                        <div class="menu-desc">자막 폴더를 선택하세요</div>
                    </div>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-card" id="menu-resume">
                    <span class="menu-icon">⏱️</span>
                    <div class="menu-text">
                        <div class="menu-title">최근 이어보기</div>
                        <div class="menu-desc" id="resume-desc">마지막 위치부터 계속</div>
                    </div>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-card" id="menu-create-folder" style="display:none">
                    <span class="menu-icon">➕</span>
                    <div class="menu-text">
                        <div class="menu-title">새 폴더 만들기</div>
                        <div class="menu-desc">SRT 자막 업로드</div>
                    </div>
                    <span class="menu-arrow">›</span>
                </div>
            </div>
        </div>

        <!-- Movie list sub-view (shown when "영화 목록" is clicked) -->
        <div id="movie-list-section" class="sub-view hidden">
            <header>
                <button id="btn-back-home" class="btn-icon">&larr;</button>
                <h1>영화 목록</h1>
            </header>
            <div id="movie-list" class="card-list"></div>
            <div id="create-movie-section">
                <button id="btn-create-movie" class="btn btn-secondary">+ 새 폴더 만들기</button>
            </div>
        </div>
    </div>

    <!-- View 2: File Selection -->
    <div id="view-files" class="view">
        <header>
            <button id="btn-back-movies" class="btn-icon">&larr;</button>
            <h1 id="movie-title"></h1>
        </header>
        <p class="hint">자막 파일을 1~2개 선택하세요</p>
        <p id="audio-hint" class="audio-hint hidden">🔊 오디오 파일이 포함되어 있습니다</p>
        <div id="file-list" class="card-list"></div>
        <div id="upload-section">
            <label class="btn btn-secondary">
                .srt 업로드
                <input type="file" id="file-upload" accept=".srt" hidden>
            </label>
        </div>
        <button id="btn-start" class="btn btn-primary" disabled>시작</button>
        <p id="dual-sub-notice" class="sub-notice hidden">2개 선택 시 두 번째 자막에 일부 손실이 생길 수 있습니다</p>
    </div>

    <!-- View 3: Subtitle Viewer -->
    <div id="view-reader" class="view">
        <header>
            <button id="btn-back-files" class="btn-icon">&larr;</button>
            <span id="position-indicator">1 / 1</span>
            <button id="btn-settings" class="btn-icon">&#9881;</button>
            <button id="btn-home" class="btn-icon" title="홈으로">&#8962;</button>
        </header>

        <div id="audio-container" class="hidden">
            <audio id="audio-player" controls preload="metadata"></audio>
        </div>

        <div id="subtitle-display">
            <div id="card-primary" class="subtitle-card primary"></div>
            <div id="card-secondary" class="subtitle-card secondary"></div>
        </div>

        <nav id="nav-controls">
            <button id="btn-prev" class="btn-nav">&larr;</button>
            <button id="btn-next" class="btn-nav">&rarr;</button>
        </nav>

        <!-- Settings Panel -->
        <div id="settings-panel" class="panel hidden">
            <div class="setting-row">
                <label>대사 표시 수</label>
                <div class="btn-group">
                    <button class="btn-option" data-lines="1">1</button>
                    <button class="btn-option" data-lines="2">2</button>
                    <button class="btn-option" data-lines="3">3</button>
                </div>
            </div>
            <div class="setting-row">
                <label>넘기기 방식</label>
                <div class="btn-group">
                    <button class="btn-option" data-mode="page">페이지</button>
                    <button class="btn-option" data-mode="slide">슬라이드</button>
                </div>
            </div>
            <div class="setting-row">
                <label>글꼴 크기</label>
                <div class="btn-group">
                    <button id="btn-font-down" class="btn-option">A-</button>
                    <span id="font-size-display">24px</span>
                    <button id="btn-font-up" class="btn-option">A+</button>
                </div>
            </div>
            <!-- Time Jump -->
            <div class="setting-row">
                <label>시간 이동</label>
                <div class="btn-group time-jump-group">
                    <input type="text" id="time-jump-input" class="time-jump-input" placeholder="00:30:00" maxlength="12">
                    <button id="btn-time-jump" class="btn-option">이동</button>
                </div>
            </div>
            <div id="time-jump-feedback" class="time-jump-feedback hidden"></div>
            <!-- Auto Sync Toggle -->
            <div class="setting-row" id="auto-sync-row" style="display:none">
                <label>자막 자동 싱크</label>
                <div class="btn-group">
                    <button id="btn-auto-sync" class="btn-option active">ON</button>
                </div>
            </div>
            <!-- Sync Offset -->
            <div class="setting-row" id="sync-offset-row" style="display:none">
                <label>자막 싱크 보정</label>
                <div class="btn-group">
                    <button id="btn-sync-down" class="btn-option">-0.5s</button>
                    <span id="sync-offset-display">±0.0s</span>
                    <button id="btn-sync-up" class="btn-option">+0.5s</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
